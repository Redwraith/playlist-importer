name: PlaylistImporter
options:
  bundleIdPrefix: app.playlistimporter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PlaylistImporter:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.playlistimporter.ios
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Playlist Importer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Public identifier of the Spotify app (PKCE login, no client secret anywhere)
        SpotifyClientID: 00ab95a420ba4290aafd5c84ef0062f9
        SpotifyRedirectURI: playlist-importer://spotify-callback
        CFBundleURLTypes:
          - CFBundleURLName: spotify-callback
            CFBundleURLSchemes: [playlist-importer]
        LSApplicationQueriesSchemes: [spotify]
  PlaylistImporterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PlaylistImporter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PlaylistImporter:
    build:
      targets:
        PlaylistImporter: all
    test:
      targets: [PlaylistImporterTests]
